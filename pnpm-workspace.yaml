# esbuild and unrs-resolver unpack native binaries in a postinstall script; vitest and the Next
# ESLint resolver fail to load without them. sharp stays unbuilt — this app is a static export with
# unoptimized images.
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: true

overrides:
  postcss: ">=8.5.28 <9"
  sharp: "0.35.4"
